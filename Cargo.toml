[package]
name = "signalwire-sdk"
version = "1.1.2"
edition = "2024"
description = "SignalWire AI Agents SDK for Rust — build AI voice agents, control live calls over WebSocket, and manage resources over REST."
license = "MIT"
repository = "https://github.com/signalwire/signalwire-rust"
keywords = ["signalwire", "ai", "agents", "swml", "voip"]
categories = ["api-bindings", "web-programming"]

# Package is published as `signalwire-sdk` because the `signalwire` crate
# name was already claimed by an unofficial wrapper. The lib name is kept
# as `signalwire` so users write `use signalwire::...` unchanged.
[lib]
name = "signalwire"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
rand = "0.8"
regex = "1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
# `ssl-rustls` enables `tiny_http::Server::https(addr, SslConfig{..})` so the
# webhook / SWML server can serve real HTTPS (driven by SWML_SSL_ENABLED /
# SWML_SSL_CERT_PATH / SWML_SSL_KEY_PATH, mirroring Python's uvicorn ssl_*).
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
ureq = { version = "3.3", features = ["json"] }
# `rustls-tls-webpki-roots` adds rustls so `wss://` actually works (the bare
# `handshake` feature has NO TLS). The relay client trusts Mozilla roots by
# default and, when SIGNALWIRE_RELAY_CA_FILE is set, a caller-supplied CA.
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Direct rustls handle (same 0.23 already in the tree via ureq/tungstenite,
# with the `ring` provider) so the relay client can build a custom
# `RootCertStore` / `ClientConfig` to trust a private CA over WSS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
# `http::Uri` is re-exported by tungstenite; depend on it directly so the relay
# client can compute the TLS/plain mode + default port for the custom-CA path.
http = "1"
url = "2"
# Optional Tower middleware integration. Enabled by default so users on
# axum / hyper get a drop-in webhook-validation Layer; opt out via
# `default-features = false` if you only need the standalone validator.
tower = { version = "0.5", optional = true, features = ["util"] }
axum = { version = "0.7", optional = true, default-features = false, features = ["http1", "tokio"] }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }

[features]
default = ["tower-middleware"]
tower-middleware = ["dep:tower", "dep:axum", "dep:http-body-util", "dep:bytes"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"

[[bin]]
name = "swaig-test"
path = "src/cli/main.rs"
