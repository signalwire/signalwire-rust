[package]
name = "signalwire-sdk"
version = "3.2.0"
edition = "2024"
# let-chains (`if cond && let Some(x) = ...`) are used throughout the crate and
# only stabilized in Rust 1.88. Edition 2024 alone implies just 1.85, so declare
# the real floor here — Cargo enforces it at build time on older toolchains.
rust-version = "1.88"
description = "SignalWire AI Agents SDK for Rust — build AI voice agents, control live calls over WebSocket, and manage resources over REST."
license = "MIT"
repository = "https://github.com/signalwire/signalwire-rust"
keywords = ["signalwire", "ai", "agents", "swml", "voip"]
categories = ["api-bindings", "web-programming"]
# Publish hygiene: the crates.io tarball ships the library, NOT the cross-port
# porting-audit pipeline. These paths are load-bearing IN-REPO (porting-sdk's
# shared audit scripts + scripts/run-ci.sh read them at the repo root) but must
# never enter a published package. Verified clean via:
#   cargo package --list | artifact_deny.py --port rust --listing -
exclude = [
    "PORT_OMISSIONS.md",
    "PORT_ADDITIONS.md",
    "PORT_SIGNATURE_OMISSIONS.md",
    "PORT_TEST_OMISSIONS.md",
    "CHECKLIST.md",
    "PROGRESS.md",
    "REST_COVERAGE_GAPS.md",
    "DOC_AUDIT_IGNORE.md",
    "INTENTIONAL_NON_IMPLEMENTATION.md",
    "INTENTIONAL_THIN_TESTS.md",
    "ROOT_HYGIENE_ALLOW.md",
    "port_signatures.json",
    "port_signatures.baseline.json",
    "port_surface.json",
    "audit_coverage.json",
    "audit_coverage_baseline.json",
    "examples/emit_corpus.rs",
    "examples/emit_skills.rs",
    "examples/relay_audit_harness.rs",
    "examples/rest_audit_harness.rs",
    "examples/skills_audit_harness.rs",
    # Sub-dir examples are [[example]] targets (gated by --all-targets, #115)
    # but are in-repo docs, not part of the published library tarball.
    "rest/examples/",
    "relay/examples/",
    "scripts/",
    "eng/",
    # Replit dev-environment config — in-repo convenience, not part of the crate.
    ".replit",
    "replit.nix",
]

# Package is published as `signalwire-sdk` because the `signalwire` crate
# name was already claimed by an unofficial wrapper. The lib name is kept
# as `signalwire` so users write `use signalwire::...` unchanged.
[lib]
name = "signalwire"
path = "src/lib.rs"

# Lint gate. `clippy::all` and the whole `pedantic` group are denied — the crate
# is at zero pedantic warnings and this keeps it there (a new pedantic finding
# fails the build everywhere, local and CI). `priority = -1` lowers the group so
# the per-lint `allow`s below win despite Cargo applying [lints.clippy] keys
# alphabetically (see rust-clippy#11237). The three allowed pedantic lints are
# deliberate, parity-/idiom-grounded choices; the full rationale lives at the
# matching `#![allow(...)]` in src/lib.rs and in PORT_PHILOSOPHY_RUST.md.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Public params take owned Value/Vec/HashMap/String to mirror Python's
# **kwargs / positional-list args (the parity surface the audit maps).
needless_pass_by_value = "allow"
# Prefab constructors / skill register_tools / compat verb builders are long
# because they mirror their Python counterparts 1:1; surface-invisible lint.
too_many_lines = "allow"
# #[must_use] is added by hand on value producers (std-dev-guide test); the
# candidate lint is allow-by-default and "expects many false positives".
must_use_candidate = "allow"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# serde_norway: maintained drop-in fork of the deprecated/archived serde_yaml
# (dtolnay archived serde_yaml 2024-03; its final release is 0.9.34+deprecated).
# Same API (from_str / Value). NOT serde_yml — that fork carries
# RUSTSEC-2025-0068 (unsound + unmaintained).
serde_norway = "0.9"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.22"
subtle = "2"
rand = "0.10"
regex = "1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
# IANA timezone database for chrono, so the datetime skill can resolve a
# requested zone (e.g. America/New_York) and compute the correct local time
# instead of always answering in UTC.
chrono-tz = "0.10"
# `ssl-rustls` enables `tiny_http::Server::https(addr, SslConfig{..})` so the
# webhook / SWML server can serve real HTTPS (driven by SWML_SSL_ENABLED /
# SWML_SSL_CERT_PATH / SWML_SSL_KEY_PATH, mirroring Python's uvicorn ssl_*).
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
ureq = { version = "3.3", features = ["json"] }
# `rustls-tls-webpki-roots` adds rustls so `wss://` actually works (the bare
# `handshake` feature has NO TLS). The relay client trusts Mozilla roots by
# default and, when SIGNALWIRE_RELAY_CA_FILE is set, a caller-supplied CA.
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Direct rustls handle (same 0.23 already in the tree via ureq/tungstenite,
# with the `ring` provider) so the relay client can build a custom
# `RootCertStore` / `ClientConfig` to trust a private CA over WSS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
# `http::Uri` is re-exported by tungstenite; depend on it directly so the relay
# client can compute the TLS/plain mode + default port for the custom-CA path.
http = "1"
url = "2"
# Correct percent-encoding of REST URL path segments (resource IDs may contain
# reserved characters). Already present transitively via `url`; declared direct
# because the REST client uses it explicitly. Query strings go through
# `url::form_urlencoded` (application/x-www-form-urlencoded).
percent-encoding = "2"
# Optional Tower middleware integration. Enabled by default so users on
# axum / hyper get a drop-in webhook-validation Layer; opt out via
# `default-features = false` if you only need the standalone validator.
tower = { version = "0.5", optional = true, features = ["util"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio"] }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }

[features]
default = ["tower-middleware"]
tower-middleware = ["dep:tower", "dep:axum", "dep:http-body-util", "dep:bytes"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"

[[bin]]
name = "swaig-test"
path = "src/cli/main.rs"

# SPEC-PARITY route registry (Set B producer; see src/bin/route_registry.rs).
[[bin]]
name = "route-registry"
path = "src/bin/route_registry.rs"

# REST wire-test call plan (per-route call expression + wire capture; consumed
# by scripts/generate_rest_tests.py — see src/bin/rest_test_plan.rs).
[[bin]]
name = "rest-test-plan"
path = "src/bin/rest_test_plan.rs"

# ---------------------------------------------------------------------------
# Sub-directory examples (rest/examples/, relay/examples/).
#
# Cargo only auto-discovers example targets under the top-level `examples/`
# dir, so files under `rest/examples/` and `relay/examples/` are NOT compiled
# by anything unless declared here. Left undeclared they rot silently — they
# had drifted to a fictional async API undetected until the #109 rewrite. These
# [[example]] entries make them real `--all-targets` targets, so the LINT gate
# (`cargo clippy --all-targets`), `cargo build --examples`, and `cargo test`
# all compile them and any future drift fails the build (#115). Keep an entry
# here for every file added to those two dirs.
[[example]]
name = "rest_buy_phone_number"
path = "rest/examples/rest_buy_phone_number.rs"

[[example]]
name = "rest_create_sip_endpoint"
path = "rest/examples/rest_create_sip_endpoint.rs"

[[example]]
name = "rest_datasphere"
path = "rest/examples/rest_datasphere.rs"

[[example]]
name = "rest_fabric_agent"
path = "rest/examples/rest_fabric_agent.rs"

[[example]]
name = "rest_fabric_subscribers"
path = "rest/examples/rest_fabric_subscribers.rs"

[[example]]
name = "rest_list_phone_numbers"
path = "rest/examples/rest_list_phone_numbers.rs"

[[example]]
name = "rest_list_recordings"
path = "rest/examples/rest_list_recordings.rs"

[[example]]
name = "rest_make_call"
path = "rest/examples/rest_make_call.rs"

[[example]]
name = "rest_manage_queues"
path = "rest/examples/rest_manage_queues.rs"

[[example]]
name = "rest_search_phone_numbers"
path = "rest/examples/rest_search_phone_numbers.rs"

[[example]]
name = "rest_send_sms"
path = "rest/examples/rest_send_sms.rs"

[[example]]
name = "rest_video_rooms"
path = "rest/examples/rest_video_rooms.rs"

# `relay_answer_and_welcome` is also an auto-discovered top-level example
# (examples/relay_answer_and_welcome.rs, an older copy linked from
# examples/README.md); Cargo forbids two example targets of the same name, so
# the RELAY-subdir copy is registered under a `_relay` suffix to gate it too.
[[example]]
name = "relay_answer_and_welcome_relay"
path = "relay/examples/relay_answer_and_welcome.rs"

[[example]]
name = "relay_dial_and_play"
path = "relay/examples/relay_dial_and_play.rs"

[[example]]
name = "relay_ivr_connect"
path = "relay/examples/relay_ivr_connect.rs"
