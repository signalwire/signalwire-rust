name: Nightly (heavy doc gates)

# Runs the HEAVY doc-execution gates that per-PR run-ci skips (SNIPPET-COMPILE,
# SNIPPET-RUN, EXAMPLES-RUN — tier=nightly) via SW_CI_TIER=nightly, which runs the
# FULL gate set (nightly is a superset of the per-PR tier).
#
# Skip-if-unchanged: the guard fingerprints the (port, porting-sdk, python) HEAD SHA
# triple into a cache key. A GREEN heavy run saves that key; the next nightly probes
# it (restore, lookup-only) — a HIT means the exact triple already passed, so the
# heavy job is skipped. A no-op nightly costs a cache probe, not the full run.

on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if nothing changed since the last successful nightly'
        type: boolean
        default: false

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      cache_key: ${{ steps.fp.outputs.cache_key }}
    steps:
      - name: Fingerprint input HEAD SHAs (port + porting-sdk + python)
        id: fp
        env:
          GH_TOKEN: ${{ github.token }}
          PSDK_TOKEN: ${{ secrets.PORTING_SDK_TOKEN }}
        run: |
          set -euo pipefail
          port_sha='${{ github.sha }}'
          psdk_sha=$(GH_TOKEN="$PSDK_TOKEN" gh api repos/signalwire/porting-sdk/commits/main --jq .sha)
          py_sha=$(gh api repos/signalwire/signalwire-python/commits/main --jq .sha)
          echo "cache_key=nightly-green-v1-${port_sha}-${psdk_sha}-${py_sha}" >> "$GITHUB_OUTPUT"
          echo "inputs -> port=$port_sha psdk=$psdk_sha python=$py_sha"
      - name: Probe last-green marker
        id: probe
        uses: actions/cache/restore@v6
        with:
          path: .nightly-green-marker
          key: ${{ steps.fp.outputs.cache_key }}
          lookup-only: true
      - name: Decide
        id: check
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ steps.probe.outputs.cache-hit }}" = "true" ]; then
            echo "input triple already passed a nightly -> skipping heavy gates"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "input triple not yet green -> running heavy gates"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  heavy:
    needs: guard
    if: needs.guard.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout signalwire-rust
        uses: actions/checkout@v7
        with:
          path: signalwire-rust

      - name: Checkout porting-sdk (mock_relay + mock_signalwire test harnesses)
        uses: actions/checkout@v7
        with:
          repository: signalwire/porting-sdk
          # Coordinated-pass pin: 'main' normally; set the PORTING_SDK_REF repo variable
          # to a wave branch to test a coordinated porting-sdk change, declared on the PR
          # (see porting-sdk/COORDINATED_PASS.md). No revert commit.
          ref: ${{ vars.PORTING_SDK_REF || 'main' }}
          path: porting-sdk
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      # The EMISSION gate compares this port's to_dict() output against the
      # signalwire-python oracle (FunctionResult), which pulls fastapi via
      # signalwire/__init__. Check it out so the EMISSION gate has its reference.
      - name: Checkout signalwire-python (EMISSION oracle)
        uses: actions/checkout@v7
        with:
          repository: signalwire/signalwire-python
          path: signalwire-python
          ref: ${{ vars.PORTING_SDK_REF || 'main' }}

      - name: Set up Rust (PINNED toolchain + nightly for rustdoc-json)
        # PINNED, in lockstep with rust-toolchain.toml — NOT `@stable`.
        #
        # This step said `@stable` while test.yml was already pinned to 1.96.0, and
        # that single-workflow gap is what reds this nightly. `@stable` installed
        # 1.97.1 and made it the rustup DEFAULT, but rustup reads
        # rust-toolchain.toml for any cargo call inside the repo, so `cargo build`
        # ran 1.96.0 — while the cache key below fingerprinted `rustc +stable`
        # (1.97.1) and restored a target/ built by that other compiler. Mismatched
        # rlibs → the SDK lib build fails → snippet_compile.py's `_rust_sdk()`
        # returns None and silently degrades to std-only typechecking, so every
        # snippet reports `error[E0463]: can't find crate for 'signalwire'` (and
        # for `serde_json`). Run 30908551752: SNIPPET-COMPILE "failed" 100s into a
        # 6.5-minute job — long before any cargo build of this crate could finish.
        #
        # Keep the version here equal to rust-toolchain.toml's `channel`.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Install Rust nightly (rustdoc-json for SIGNATURES gate)
        uses: dtolnay/rust-toolchain@nightly

      # scripts/run-pylint.sh fails LOUD when ruff is absent rather than skipping,
      # so the PY-LINT gate cannot pass vacuously — which means a workflow that
      # runs run-ci.sh MUST install it. test.yml has this step; this file did not,
      # so the nightly red with "ERROR: ruff not found on PATH" was a missing CI
      # dependency, not a code finding (run 30908551752).
      - name: Install ruff (PY-LINT gate)
        run: |
          # PINNED EXACT, in lockstep with SW_RUFF_VERSION in scripts/_env.sh: an
          # unbounded `pip install ruff` resolves the newest release at CI time, so
          # a ruff release that adds a rule reds PY-LINT on a commit green locally.
          pip install "ruff==0.15.21"
          # Assert the pin took — pip can satisfy a spec from an unexpected index
          # or cache, so verify rather than assume.
          ruff --version
          ruff --version | grep -qw '0\.15\.21' || { echo "FATAL: ruff is not the pinned 0.15.21" >&2; exit 1; }

      # Split restore/save (not the combined actions/cache) so the target/ build
      # cache SAVES even when the gate job fails. The combined action's post-save
      # is SKIPPED on a failed prior step, and every rust run is currently red on
      # the pre-existing spec-coupling — so the target/ cache never updated and
      # stayed frozen on a stale green build, recompiling the drift each run. The
      # save step below runs with if: always(). Registry/git keyed on Cargo.lock;
      # target/ needs the run_id suffix so each run persists an updated build.
      #
      # No rustc fingerprint in the key (test.yml dropped it for the same reason):
      # the toolchain is PINNED above, so it cannot drift under a fixed Cargo.lock,
      # and fingerprinting `rustc +stable` was itself the bug — it keyed the cache
      # to a compiler that is NOT the one cargo uses in this repo.
      - name: Restore cargo registry + target
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            signalwire-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('signalwire-rust/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('signalwire-rust/Cargo.lock') }}-

      - name: Set up Python (porting-sdk audit scripts)
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python test harnesses (mock_relay + mock_signalwire)
        run: |
          pip install -e porting-sdk/test_harness/mock_relay
          pip install -e porting-sdk/test_harness/mock_signalwire

      # EMISSION needs `import signalwire` (the oracle). Install from the
      # adjacent checkout only if not already importable.
      - name: Install signalwire-python (EMISSION oracle) if not importable
        run: |
          if python -c "import signalwire.core.function_result" 2>/dev/null; then
            echo "signalwire-python already importable; skipping install"
          else
            pip install ./signalwire-python
          fi

      - name: Run CI gate script (TEST -> SIGNATURES -> DRIFT -> NO-CHEAT)
        working-directory: signalwire-rust
        env:
          PORTING_SDK: ${{ github.workspace }}/porting-sdk
          SW_CI_TIER: nightly
          # COORDINATED-PASS reads the live PR body/labels via 'gh api' to see a
          # 'Coordinated-With:' declaration edited after the triggering push.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/run-ci.sh

      # Save the cargo registry/git + target/ build cache even if the gate failed
      # (the build still ran + populated target/). Unique run_id key so every run
      # persists an updated cache; the restore prefix above picks up the most recent.
      - name: Save cargo registry + target
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            signalwire-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('signalwire-rust/Cargo.lock') }}-${{ github.run_id }}

      - name: Record green marker for this input triple
        run: 'echo green > .nightly-green-marker'
      - uses: actions/cache/save@v6
        with:
          path: .nightly-green-marker
          key: ${{ needs.guard.outputs.cache_key }}

