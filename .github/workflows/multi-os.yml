name: Multi-OS (macOS + Windows)

# Plan §6.4 — the multi-OS CI lane. ubuntu-only CI cannot certify an A-grade
# cross-platform SDK; this runs the two OS-SENSITIVE suites — TEST and
# PACKAGE-SMOKE — on macos-latest AND windows-latest so a Darwin/Windows-only
# regression (path handling, TLS trust store, line endings, socket binding)
# surfaces. NIGHTLY tier (runner cost) + manual dispatch, with a skip-if-unchanged
# guard so an untouched tree doesn't burn macOS/Windows minutes.
#
# Scope: TEST (cargo test) + PACKAGE-SMOKE (the published-crate build/install/import
# smoke). The full gate set stays on the ubuntu per-PR lane (test.yml). RELAY/REST
# tests use the shared Python mocks (adjacent porting-sdk checkout), self-spawned by
# the harness, so both OSes need Python too.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # Nightly at 07:00 UTC.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skip-if-unchanged: fingerprint this port's HEAD; a scheduled run whose tree
  # hasn't moved since the last run is a no-op. (workflow_dispatch always runs.)
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD~1 >/dev/null 2>&1 \
               && [ -z "$(git diff --name-only HEAD~1 HEAD)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tree unchanged since last commit — skipping multi-OS run"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  os-matrix:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout signalwire-rust
        uses: actions/checkout@v7
        with:
          path: signalwire-rust

      - name: Checkout porting-sdk (mock harnesses + PACKAGE-SMOKE script)
        uses: actions/checkout@v7
        with:
          repository: signalwire/porting-sdk
          # PINNED to wave/1-aplus: the mcp_gateway client-skill oracle (MCPGatewaySkill) lives there; REVERT to main on merge.
          ref: main
          # PINNED to the gate-enforcement plan branch: the WIRED-MODES gate wired on
          # this branch calls porting-sdk scripts (check_wired_modes.py) that live on
          # porting-sdk plan/a-bar-2026-07-18, not yet on main. REVERT this ref to main
          # when that porting-sdk branch merges.
          path: porting-sdk
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Activate the MSVC build environment on the Windows runner. dtolnay/rust-
      # toolchain@stable installs the *-pc-windows-msvc host toolchain, but the TEST
      # and PACKAGE-SMOKE steps below run under `shell: bash` (git-bash). Without the
      # MSVC dev env active, cc-rs (ring's build script) fails to detect a C compiler
      # and falls back to a Unix-style `/usr/bin/gcc`, so building `ring` fails:
      #   error occurred in cc-rs: failed to find tool "/usr/bin/gcc"
      # ilammy/msvc-dev-cmd exports the VS dev environment (cl.exe/link.exe on PATH
      # plus INCLUDE/LIB/LIBPATH) via $GITHUB_ENV/$GITHUB_PATH; those persist into the
      # later bash steps, so cc-rs picks MSVC and ring's C build succeeds. windows-latest
      # ships Visual Studio, so nothing is installed. Guarded to Windows (no-op on macOS).
      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Pin the MSVC linker by ABSOLUTE PATH so cargo/rustc never resolve `link.exe`
      # through git-bash's PATH. The TEST and PACKAGE-SMOKE steps run under
      # `shell: bash` (git-bash), which prepends `C:\Program Files\Git\usr\bin` to
      # PATH — and that dir contains a coreutils `link.exe` (a hard-link utility) that
      # SHADOWS the MSVC linker even though msvc-dev-cmd put MSVC's bin dir first in the
      # Windows PATH. rustc then invokes git-bash's link.exe and the build fails:
      #   error: linking with `link.exe` failed
      #   note: /usr/bin/link: extra operand '...rcgu.o'
      # Setting CARGO_TARGET_<triple>_LINKER to the absolute MSVC link.exe makes cargo
      # pass that exact path to rustc's -Clinker, bypassing PATH resolution entirely
      # (a RUSTFLAGS='-Clinker=link.exe' would NOT help — it still resolves via PATH).
      # msvc-dev-cmd exports VCToolsInstallDir; the host-x64 linker lives under it.
      # The env var is inherited by both the bash TEST step and the Python
      # PACKAGE-SMOKE step (which also shells out to cargo), so both link with MSVC.
      - name: Pin MSVC linker for cargo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path $linker)) {
            throw "MSVC link.exe not found at $linker (VCToolsInstallDir=$env:VCToolsInstallDir)"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Pinned MSVC linker: $linker"

      - name: Set up Python (shared mocks + PACKAGE-SMOKE)
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python test harnesses (mock_relay + mock_signalwire)
        run: |
          pip install -e porting-sdk/test_harness/mock_relay
          pip install -e porting-sdk/test_harness/mock_signalwire

      # TEST — the cargo test suite (OS-sensitive: sockets, TLS, paths). Uses the
      # canonical run-tests.sh so it matches the ubuntu lane exactly. bash is
      # available on both macOS and Windows GitHub runners (git-bash).
      - name: TEST (cargo test)
        shell: bash
        working-directory: signalwire-rust
        env:
          PORTING_SDK: ${{ github.workspace }}/porting-sdk
        run: bash scripts/run-tests.sh

      # PACKAGE-SMOKE — build/install/import the real published crate (OS-sensitive:
      # packaging + linking).
      - name: PACKAGE-SMOKE (published crate builds + imports)
        shell: bash
        working-directory: signalwire-rust
        env:
          PORTING_SDK: ${{ github.workspace }}/porting-sdk
        run: python3 "$PORTING_SDK/scripts/package_smoke.py" --port rust --repo .
