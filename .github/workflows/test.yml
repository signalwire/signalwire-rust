name: Test

# Runs the full per-port CI gate set: cargo test, signature regen, drift
# against the Python reference, and the no-cheat-tests audit. Mirrors
# `bash scripts/run-ci.sh` so there's no drift between local and CI.
#
# Test runner is PARALLEL (cargo's default — no --test-threads=1, no
# cross-binary flock, no global mutex). The shared mock_signalwire /
# mock_relay servers are made concurrency-safe by per-session isolation:
# RELAY scopes by the server-assigned handshake `sessionid`; REST scopes by
# each test's unique random project => unique Authorization header. The only
# remaining serialization is a narrow file-local lock for the dedicated TLS
# mock-relay instance (tests/common/tls_support.rs), which runs on its own
# fixed port and is not part of the session-isolated suite.

env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout signalwire-rust
        uses: actions/checkout@v6
        with:
          path: signalwire-rust

      - name: Checkout porting-sdk (mock_relay + mock_signalwire test harnesses)
        uses: actions/checkout@v6
        with:
          repository: signalwire/porting-sdk
          path: porting-sdk
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      # The EMISSION gate compares this port's to_dict() output against the
      # signalwire-python oracle (FunctionResult), which pulls fastapi via
      # signalwire/__init__. Check it out so the EMISSION gate has its reference.
      - name: Checkout signalwire-python (EMISSION oracle)
        uses: actions/checkout@v6
        with:
          repository: signalwire/signalwire-python
          path: signalwire-python
          ref: main

      - name: Set up Rust (stable + nightly for rustdoc-json)
        # Stable for `cargo test` + the FMT/LINT gates (run-ci.sh pins those to
        # `cargo +stable`); nightly for the rustdoc-json output consumed by
        # scripts/enumerate_signatures.py (Gate 2). clippy + rustfmt components
        # are explicit so `cargo +stable fmt`/`clippy` resolve even though the
        # nightly step below makes nightly the default toolchain.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Rust nightly (rustdoc-json for SIGNATURES gate)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            signalwire-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('signalwire-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python (porting-sdk audit scripts)
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python test harnesses (mock_relay + mock_signalwire)
        run: |
          pip install -e porting-sdk/test_harness/mock_relay
          pip install -e porting-sdk/test_harness/mock_signalwire

      # EMISSION needs `import signalwire` (the oracle). Install from the
      # adjacent checkout only if not already importable.
      - name: Install signalwire-python (EMISSION oracle) if not importable
        run: |
          if python -c "import signalwire.core.function_result" 2>/dev/null; then
            echo "signalwire-python already importable; skipping install"
          else
            pip install ./signalwire-python
          fi

      - name: Run CI gate script (TEST -> SIGNATURES -> DRIFT -> NO-CHEAT)
        working-directory: signalwire-rust
        env:
          PORTING_SDK: ${{ github.workspace }}/porting-sdk
        run: bash scripts/run-ci.sh
