name: Publish Release
env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout signalwire-rust
        uses: actions/checkout@v7
        with:
          path: signalwire-rust

      - name: Checkout porting-sdk (mock_relay + mock_signalwire test harnesses)
        uses: actions/checkout@v7
        with:
          repository: signalwire/porting-sdk
          # Publish always builds against porting-sdk main — deliberately NOT the
          # coordinated-pass PORTING_SDK_REF variable, so a release can never ship from
          # an unmerged wave branch (see porting-sdk/COORDINATED_PASS.md).
          ref: main
          path: porting-sdk
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      - name: Set up Rust (stable)
        # PINNED, in lockstep with rust-toolchain.toml's `channel` (NOT `@stable`).
        # Cargo.toml denies clippy::all + the whole pedantic group with `-D warnings`,
        # so a new stable release is an instant build failure with nothing in the diff
        # to explain it. `@stable` also fights the pin: it becomes the rustup DEFAULT
        # while cargo-inside-the-repo still obeys rust-toolchain.toml, so any cache keyed
        # on `rustc +stable` points at a compiler cargo never uses (that mismatch reds
        # nightly.yml's SNIPPET-COMPILE; see its comment).
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install Rust nightly (rustdoc-json for SIGNATURES gate)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            signalwire-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('signalwire-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python (porting-sdk audit scripts)
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python test harnesses (mock_relay + mock_signalwire)
        run: |
          pip install -e porting-sdk/test_harness/mock_relay
          pip install -e porting-sdk/test_harness/mock_signalwire

      - name: Run CI gate script (TEST -> SIGNATURES -> DRIFT -> NO-CHEAT)
        working-directory: signalwire-rust
        env:
          PORTING_SDK: ${{ github.workspace }}/porting-sdk
        run: bash scripts/run-ci.sh

      - name: Publish to crates.io
        working-directory: signalwire-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
